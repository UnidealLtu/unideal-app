
name: Listings Service Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/listings-service

    env:
      # Test-only value; no PostgreSQL connection is needed
      POSTGRES_PASSWORD: github-actions-test-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run tests and check coverage
        run: |
          python -m pytest -v \
            --cov=main \
            --cov=models \
            --cov=database \
            --cov-report=term-missing \
            --cov-fail-under=50
