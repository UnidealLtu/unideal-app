
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unideal_listings
      POSTGRES_USER: unideal_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - listings_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unideal_dev -d unideal_listings"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  listings_data:
